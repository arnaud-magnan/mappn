version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.5
    container_name: mappn-db
    environment:
      POSTGRES_DB: mappn
      POSTGRES_USER: mappn
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mappn -d mappn"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mappn-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: mappn-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://mappn:secret@db:5432/mappn
      REDIS_URL: redis://redis:6379
      SECRET_KEY: your-secret-key-change-this-in-production-min-32-chars-required
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      GEOFENCE_RADIUS_M: "75"
      VISIT_MIN_DURATION_SECONDS: "300"
      VISIT_MIN_READINGS: "3"
      DEBUG: "False"
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    env_file:
      - .env

  worker:
    build: .
    container_name: mappn-worker
    command: python -m arq app.workers.scraping.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://mappn:secret@db:5432/mappn
      REDIS_URL: redis://redis:6379
      SECRET_KEY: your-secret-key-change-this-in-production-min-32-chars-required
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      GEOFENCE_RADIUS_M: "75"
      VISIT_MIN_DURATION_SECONDS: "300"
      VISIT_MIN_READINGS: "3"
      DEBUG: "False"
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    env_file:
      - .env

volumes:
  pgdata:
